<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>项目推进者 - 仪表盘</title>
<style>
  :root {
    --bg: #0f1117;
    --card: #1a1d27;
    --border: #2a2d3a;
    --text: #e4e6ef;
    --muted: #8b8fa3;
    --green: #34d399;
    --yellow: #fbbf24;
    --red: #f87171;
    --blue: #60a5fa;
    --purple: #a78bfa;
    --cyan: #22d3ee;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px;
    min-height: 100vh;
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }
  .header h1 { font-size: 22px; font-weight: 700; }
  .header .meta { font-size: 13px; color: var(--muted); }
  .health-badge {
    display: inline-block;
    padding: 4px 14px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
  }
  .health-green { background: rgba(52,211,153,.15); color: var(--green); }
  .health-yellow { background: rgba(251,191,36,.15); color: var(--yellow); }
  .health-red { background: rgba(248,113,113,.15); color: var(--red); }

  /* Stats Row */
  .stats-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 12px;
    margin-bottom: 24px;
  }
  .stat-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    text-align: center;
  }
  .stat-card .number { font-size: 28px; font-weight: 700; }
  .stat-card .label { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .stat-done .number { color: var(--green); }
  .stat-progress .number { color: var(--blue); }
  .stat-todo .number { color: var(--muted); }
  .stat-blocked .number { color: var(--red); }
  .stat-overdue .number { color: var(--yellow); }
  .stat-total .number { color: var(--text); }

  /* Milestones */
  .section { margin-bottom: 24px; }
  .section-title {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .section-title .icon { font-size: 18px; }
  .milestone-list { display: flex; flex-direction: column; gap: 10px; }
  .milestone-item {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
  }
  .milestone-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }
  .milestone-name { font-weight: 600; font-size: 14px; }
  .milestone-deadline { font-size: 12px; color: var(--muted); }
  .progress-bar-bg {
    height: 8px;
    background: var(--border);
    border-radius: 4px;
    overflow: hidden;
    margin-bottom: 6px;
  }
  .progress-bar-fill {
    height: 100%;
    border-radius: 4px;
    transition: width 0.5s ease;
  }
  .progress-bar-fill.green { background: var(--green); }
  .progress-bar-fill.blue { background: var(--blue); }
  .progress-bar-fill.yellow { background: var(--yellow); }
  .progress-bar-fill.red { background: var(--red); }
  .progress-label { font-size: 12px; color: var(--muted); }
  .risk-tag {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 600;
  }
  .risk-none { background: rgba(52,211,153,.1); color: var(--green); }
  .risk-low { background: rgba(96,165,250,.1); color: var(--blue); }
  .risk-medium { background: rgba(251,191,36,.1); color: var(--yellow); }
  .risk-high { background: rgba(248,113,113,.1); color: var(--red); }

  /* Kanban */
  .kanban {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
  }
  @media (max-width: 800px) { .kanban { grid-template-columns: repeat(2, 1fr); } }
  .kanban-col {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    min-height: 200px;
  }
  .kanban-col-title {
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .kanban-count {
    background: var(--border);
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 11px;
    color: var(--muted);
  }
  .task-card {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px;
    margin-bottom: 8px;
    font-size: 12px;
    cursor: default;
    transition: border-color 0.2s;
  }
  .task-card:hover { border-color: var(--blue); }
  .task-card .task-id { font-weight: 600; color: var(--blue); margin-bottom: 4px; }
  .task-card .task-title { color: var(--text); margin-bottom: 6px; line-height: 1.4; }
  .task-card .task-meta { color: var(--muted); font-size: 11px; display: flex; justify-content: space-between; }
  .priority-dot {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    margin-right: 4px;
    vertical-align: middle;
  }
  .p0 { background: var(--red); }
  .p1 { background: var(--yellow); }
  .p2 { background: var(--blue); }
  .p3 { background: var(--muted); }

  /* Blockers */
  .blocker-list { display: flex; flex-direction: column; gap: 8px; }
  .blocker-item {
    background: var(--card);
    border-left: 3px solid var(--red);
    border-radius: 0 8px 8px 0;
    padding: 12px 14px;
    font-size: 13px;
  }
  .blocker-item .blocker-title { font-weight: 600; margin-bottom: 4px; }
  .blocker-item .blocker-detail { color: var(--muted); font-size: 12px; }

  /* PR & Regression */
  .info-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 12px;
  }
  .info-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
  }
  .info-card .info-label { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .info-card .info-value { font-size: 20px; font-weight: 700; }
  .pass { color: var(--green); }
  .fail { color: var(--red); }
  .running { color: var(--yellow); }

  /* Empty state */
  .empty {
    text-align: center;
    color: var(--muted);
    padding: 32px;
    font-size: 13px;
  }

  /* Footer */
  .footer {
    margin-top: 32px;
    text-align: center;
    font-size: 12px;
    color: var(--muted);
    border-top: 1px solid var(--border);
    padding-top: 16px;
  }
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>📋 项目仪表盘</h1>
    <div class="meta">基线版本：<span id="baseline">-</span> &nbsp;|&nbsp; 更新时间：<span id="updateTime">-</span></div>
  </div>
  <div><span id="healthBadge" class="health-badge health-green">🟢 良好</span></div>
</div>

<!-- Stats -->
<div class="stats-row" id="statsRow">
  <div class="stat-card stat-total"><div class="number" id="statTotal">0</div><div class="label">总任务</div></div>
  <div class="stat-card stat-done"><div class="number" id="statDone">0</div><div class="label">已完成</div></div>
  <div class="stat-card stat-progress"><div class="number" id="statProgress">0</div><div class="label">进行中</div></div>
  <div class="stat-card stat-todo"><div class="number" id="statTodo">0</div><div class="label">待开始</div></div>
  <div class="stat-card stat-blocked"><div class="number" id="statBlocked">0</div><div class="label">阻塞</div></div>
  <div class="stat-card stat-overdue"><div class="number" id="statOverdue">0</div><div class="label">延期</div></div>
</div>

<!-- Milestones -->
<div class="section">
  <div class="section-title"><span class="icon">🏁</span> 里程碑进度</div>
  <div class="milestone-list" id="milestoneList">
    <div class="empty">暂无里程碑数据</div>
  </div>
</div>

<!-- Kanban -->
<div class="section">
  <div class="section-title"><span class="icon">📌</span> 任务看板</div>
  <div class="kanban" id="kanban">
    <div class="kanban-col">
      <div class="kanban-col-title">📋 待开始 <span class="kanban-count" id="kanbanTodoCount">0</span></div>
      <div id="kanbanTodo"></div>
    </div>
    <div class="kanban-col">
      <div class="kanban-col-title">🔄 进行中 <span class="kanban-count" id="kanbanProgressCount">0</span></div>
      <div id="kanbanProgress"></div>
    </div>
    <div class="kanban-col">
      <div class="kanban-col-title">🚫 阻塞 <span class="kanban-count" id="kanbanBlockedCount">0</span></div>
      <div id="kanbanBlocked"></div>
    </div>
    <div class="kanban-col">
      <div class="kanban-col-title">✅ 已完成 <span class="kanban-count" id="kanbanDoneCount">0</span></div>
      <div id="kanbanDone"></div>
    </div>
  </div>
</div>

<!-- Blockers -->
<div class="section">
  <div class="section-title"><span class="icon">🚨</span> 阻塞与延期</div>
  <div class="blocker-list" id="blockerList">
    <div class="empty">暂无阻塞项 🎉</div>
  </div>
</div>

<!-- PR & Regression -->
<div class="section">
  <div class="section-title"><span class="icon">🔀</span> PR 状态 & 回归</div>
  <div class="info-grid">
    <div class="info-card">
      <div class="info-label">开放 PR</div>
      <div class="info-value" id="prOpen">0</div>
    </div>
    <div class="info-card">
      <div class="info-label">可审查</div>
      <div class="info-value" id="prReviewable">0</div>
    </div>
    <div class="info-card">
      <div class="info-label">CI 失败</div>
      <div class="info-value" style="color:var(--red)" id="prCiFail">0</div>
    </div>
    <div class="info-card">
      <div class="info-label">停滞 PR</div>
      <div class="info-value" style="color:var(--yellow)" id="prStale">0</div>
    </div>
    <div class="info-card">
      <div class="info-label">回归测试（M?）</div>
      <div class="info-value" id="regressionResult">-</div>
    </div>
    <div class="info-card">
      <div class="info-label">通过率</div>
      <div class="info-value" id="regressionRate">-</div>
    </div>
  </div>
</div>

<div class="footer">项目推进者 · 自动生成 · 数据驱动交付</div>

<script>
// Dashboard rendering — reads from embedded JSON data
const DASHBOARD_DATA = /*__DATA__*/null/*__END__*/;

function render(data) {
  if (!data) return;
  const d = data.dashboard || data;

  // Header
  document.getElementById('baseline').textContent = d.baseline_version || '-';
  document.getElementById('updateTime').textContent = d.updated_at || '-';

  const healthEl = document.getElementById('healthBadge');
  const healthMap = {
    green: ['🟢 良好', 'health-green'],
    yellow: ['🟡 注意', 'health-yellow'],
    red: ['🔴 风险', 'health-red']
  };
  const h = healthMap[d.health] || healthMap.green;
  healthEl.textContent = h[0];
  healthEl.className = 'health-badge ' + h[1];

  // Stats
  const s = d.summary || {};
  document.getElementById('statTotal').textContent = s.total ?? '-';
  document.getElementById('statDone').textContent = s.done ?? '-';
  document.getElementById('statProgress').textContent = s.in_progress ?? '-';
  document.getElementById('statTodo').textContent = s.todo ?? '-';
  document.getElementById('statBlocked').textContent = s.blocked ?? '-';
  document.getElementById('statOverdue').textContent = s.overdue ?? '-';

  // Milestones
  const ml = document.getElementById('milestoneList');
  if (d.milestones && d.milestones.length) {
    ml.innerHTML = d.milestones.map(m => {
      const pct = m.total ? Math.round(m.done / m.total * 100) : 0;
      const barColor = m.status === 'completed' ? 'green' : m.risk === 'high' ? 'red' : m.risk === 'medium' ? 'yellow' : 'blue';
      const statusMap = { not_started: '未开始', in_progress: '进行中', completed: '已完成', blocked: '阻塞' };
      const riskMap = { none: '无风险', low: '低风险', medium: '中风险', high: '高风险' };
      return `<div class="milestone-item">
        <div class="milestone-header">
          <span class="milestone-name">${m.id} · ${m.name || ''}</span>
          <span><span class="risk-tag risk-${m.risk || 'none'}">${riskMap[m.risk] || '无风险'}</span> <span class="milestone-deadline">截止 ${m.deadline || '-'}</span></span>
        </div>
        <div class="progress-bar-bg"><div class="progress-bar-fill ${barColor}" style="width:${pct}%"></div></div>
        <div class="progress-label">${m.done || 0}/${m.total || 0} 完成（${pct}%）· ${statusMap[m.status] || m.status}</div>
      </div>`;
    }).join('');
  }

  // Kanban
  if (d.issues) {
    const cols = { todo: [], in_progress: [], blocked: [], done: [] };
    d.issues.forEach(i => {
      const arr = cols[i.status] || cols.todo;
      arr.push(i);
    });
    const renderCard = (i) => `<div class="task-card">
      <div class="task-id"><span class="priority-dot p${(i.priority||'p2').replace('P','').toLowerCase()}"></span>${i.issue_id}</div>
      <div class="task-title">${i.title}</div>
      <div class="task-meta"><span>${i.milestone || ''}</span><span>${i.assignee || '未分配'}</span></div>
    </div>`;
    ['todo','in_progress','blocked','done'].forEach(k => {
      const names = { todo:'Todo', in_progress:'Progress', blocked:'Blocked', done:'Done' };
      document.getElementById('kanban' + names[k] + 'Count').textContent = cols[k].length;
      document.getElementById('kanban' + names[k]).innerHTML = cols[k].length ? cols[k].map(renderCard).join('') : '<div class="empty" style="padding:12px;font-size:11px">无</div>';
    });
  }

  // Blockers
  const bl = document.getElementById('blockerList');
  if (d.blockers && d.blockers.length) {
    bl.innerHTML = d.blockers.map(b => `<div class="blocker-item">
      <div class="blocker-title">${b.item} · ${b.type === 'overdue' ? '延期' : '阻塞'}</div>
      <div class="blocker-detail">${b.reason} · 影响：${b.impact} · ${b.assignee || ''} · 预计 ${b.eta || '未知'}</div>
    </div>`).join('');
  }

  // PR & Regression
  if (d.pr_status) {
    document.getElementById('prOpen').textContent = d.pr_status.open ?? '-';
    document.getElementById('prReviewable').textContent = d.pr_status.reviewable ?? '-';
    document.getElementById('prCiFail').textContent = d.pr_status.ci_failed ?? '-';
    document.getElementById('prStale').textContent = d.pr_status.stale ?? '-';
  }
  if (d.regression) {
    const rMap = { pass: ['✅ 通过', 'pass'], fail: ['❌ 失败', 'fail'], running: ['🔄 进行中', 'running'] };
    const r = rMap[d.regression.result] || ['-', ''];
    document.getElementById('regressionResult').textContent = r[0];
    document.getElementById('regressionResult').className = 'info-value ' + r[1];
    document.getElementById('regressionRate').textContent = d.regression.pass_rate || '-';
    document.getElementById('regressionRate').className = 'info-value ' + (d.regression.result === 'pass' ? 'pass' : '');
  }
}

render(DASHBOARD_DATA);
</script>
</body>
</html>
